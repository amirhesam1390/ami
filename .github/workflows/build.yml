name: Build Telegram APK (arm64 signed)
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: [A] Locate SDK + sdkmanager
        run: |
          set -x
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          ls "$SDK" || true
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "SDKMANAGER=$SM"
          [ -n "$SM" ] || { echo "sdkmanager پیدا نشد"; exit 1; }
          echo "SDKMANAGER=$SM" >> $GITHUB_ENV
          echo "$(dirname $SM)" >> $GITHUB_PATH

      - name: [B] Install packages (log full)
        run: |
          set -x
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;21.4.7075529" "cmake;3.22.1" 2>&1 | tee sdk_install.log
          echo "EXIT=$?"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          ls "$ANDROID_HOME/ndk" || true
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/cmake" || true

      - name: [C] local.properties
        run: |
          set -x
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties
          cat local.properties

      - name: [D] Restore keystore
        run: |
          set -x
          mkdir -p /root/owpengram-keystore
          if [ -n "${{ secrets.OWPENGRAM_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.OWPENGRAM_KEYSTORE_B64 }}" | base64 -d > /root/owpengram-keystore/owpengram.jks
          else
            keytool -genkeypair -v \
              -keystore /root/owpengram-keystore/owpengram.jks \
              -alias owpengram -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass owpengram123 -keypass owpengram123 \
              -dname "CN=owpengram, OU=Dev, O=owpengram, L=NA, S=NA, C=IR"
          fi
          ls -la /root/owpengram-keystore/

      - name: [E] chmod gradlew
        run: |
          set -x
          chmod +x gradlew
          ./gradlew --version

      - name: [F] Configure (dry) — log full
        run: |
          set -x
          set -o pipefail
          ./gradlew --no-daemon --stacktrace -m :TMessagesProj_AppStandalone:assembleRelease 2>&1 | tee configure.log
          echo "EXIT=$?"

      - name: [G] Build arm64 signed APK — log full
        if: success()
        run: |
          set -x
          set -o pipefail
          ./gradlew --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=/root/owpengram-keystore/owpengram.jks \
            -Pandroid.injected.signing.store.password=owpengram123 \
            -Pandroid.injected.signing.key.alias=owpengram \
            -Pandroid.injected.signing.key.password=owpengram123 \
            :TMessagesProj_AppStandalone:assembleRelease 2>&1 | tee build.log

      - name: [H] Verify + collect
        if: always()
        run: |
          set -x
          find . -name "*.apk" -type f | tee apks.txt
          APK=$(head -1 apks.txt || true)
          if [ -n "$APK" ]; then
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" 2>&1 | tee apk_verify.txt || true
            ls -la "$APK"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" 2>&1 | grep -E "package:|native-code" | tee -a apk_verify.txt || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-arm64-signed
          path: "**/*.apk"
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-full
          path: |
            build.log
            configure.log
            sdk_install.log
            apk_verify.txt
            apks.txt
            local.properties
          if-no-files-found: warn
