name: Build Telegram APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        cd /tmp
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_HOME/ndk/27.2.12479018" >> local.properties

    - name: Setup release keystore
      run: |
        if [ ! -f TMessagesProj/config/release.keystore ]; then
          keytool -genkey -v -keystore TMessagesProj/config/release.keystore \
            -alias telegram -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=OwpenGram, OU=Dev, O=OwpenGram, L=Tehran, S=Tehran, C=IR"
        fi

    - name: Set gradle.properties
      run: |
        cat >> gradle.properties <<EOF
        RELEASE_KEY_PASSWORD=android
        RELEASE_KEY_ALIAS=telegram
        RELEASE_STORE_PASSWORD=android
        org.gradle.parallel=true
        org.gradle.caching=true
        android.useAndroidX=true
        android.enableJetifier=false
        EOF

    - name: List available gradle tasks
      run: ./gradlew tasks --all 2>&1 | grep -i "assemble" | head -20

    - name: Build APK (full log)
      run: |
        ./gradlew TMessagesProj:assembleRelease -Parm64-v8a --stacktrace --info 2>&1 | tee /tmp/build.log
        exit ${PIPESTATUS[0]}

    - name: Show build errors
      if: failure()
      run: |
        echo "===== LAST 500 LINES ====="
        tail -500 /tmp/build.log
        echo ""
        echo "===== ERROR LINES ====="
        grep -iE "error|fail|exception|cannot|unable" /tmp/build.log | tail -100

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: telegram-owpengram-apk
        path: TMessagesProj/build/outputs/apk/**/*.apk
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: /tmp/build.log
        retention-days: 7
