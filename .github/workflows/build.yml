name: Build Telegram APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0 ndk;27.2.12479018 cmake;3.22.1'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Update gradle wrapper
      run: gradle wrapper --gradle-version 8.5 --distribution-type bin

    - name: Setup release keystore
      run: |
        if [ ! -f TMessagesProj/config/release.keystore ]; then
          keytool -genkey -v -keystore TMessagesProj/config/release.keystore \
            -alias telegram -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=OwpenGram, OU=Dev, O=OwpenGram, L=Tehran, S=Tehran, C=IR"
        fi

    - name: Set gradle.properties
      run: |
        cat >> gradle.properties <<EOF
        RELEASE_KEY_PASSWORD=android
        RELEASE_KEY_ALIAS=telegram
        RELEASE_STORE_PASSWORD=android
        org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
        org.gradle.parallel=true
        org.gradle.caching=true
        android.useAndroidX=true
        android.enableJetifier=false
        EOF

    - name: Build APK
      run: |
        ./gradlew TMessagesProj:assembleAfatRelease -Parm64-v8a --stacktrace 2>&1 | tail -200

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: telegram-owpengram-apk
        path: TMessagesProj/build/outputs/apk/**/*.apk
        retention-days: 30
