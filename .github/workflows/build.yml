name: Build Telegram APK (arm64 signed)
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (official action)
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;21.4.7075529" "cmake;3.22.1"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          ls "$ANDROID_HOME/ndk"
          ls "$ANDROID_HOME/build-tools"
          ls "$ANDROID_HOME/platforms"

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> local.properties
          cat local.properties

      - name: Restore keystore
        run: |
          set -e
          mkdir -p /root/owpengram-keystore
          if [ -n "${{ secrets.OWPENGRAM_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.OWPENGRAM_KEYSTORE_B64 }}" | base64 -d > /root/owpengram-keystore/owpengram.jks
            echo "keystore restored from secret"
          else
            keytool -genkeypair -v \
              -keystore /root/owpengram-keystore/owpengram.jks \
              -alias owpengram -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass owpengram123 -keypass owpengram123 \
              -dname "CN=owpengram, OU=Dev, O=owpengram, L=NA, S=NA, C=IR"
            echo "generated temp keystore"
          fi

      - name: chmod gradlew
        run: chmod +x gradlew

      - name: Build arm64 signed APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=/root/owpengram-keystore/owpengram.jks \
            -Pandroid.injected.signing.store.password=owpengram123 \
            -Pandroid.injected.signing.key.alias=owpengram \
            -Pandroid.injected.signing.key.password=owpengram123 \
            :TMessagesProj_AppStandalone:assembleRelease 2>&1 | tee build.log

      - name: Verify + collect
        if: always()
        run: |
          find . -name "*.apk" -type f | tee apks.txt
          APK=$(head -1 apks.txt || true)
          if [ -n "$APK" ]; then
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" 2>&1 | tee apk_verify.txt || true
            ls -la "$APK"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" 2>&1 | grep -E "package:|native-code" | tee -a apk_verify.txt || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-arm64-signed
          path: "**/*.apk"
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            build.log
            apk_verify.txt
            apks.txt
            local.properties
          if-no-files-found: warn
