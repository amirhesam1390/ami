name: Build Telegram APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;21.4.7075529" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}

      - name: chmod gradlew
        run: chmod +x gradlew

      - name: List assemble tasks
        run: ./gradlew tasks --all | grep -iE "assemble.*Release" | tee tasks.txt || true

      - name: Build APK (assembleRelease با لاگ کامل)
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --info assembleRelease 2>&1 | tee build_full.log
          echo "=== EXIT CODE: $? ==="

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build_full.log
            tasks.txt

      - name: Find APKs
        if: always()
        run: find . -name "*.apk" -type f | tee apks.txt

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            **/*.apk
          if-no-files-found: warn
