name: Build Telegram APK arm64 signed
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: A-Prepare-SDK-dirs
        shell: bash
        run: |
          set -x
          SDK="/usr/local/lib/android/sdk"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
          } >> "$GITHUB_ENV"
          mkdir -p "$SDK/ndk" "$SDK/cmake"
          ls "$SDK"

      - name: B-Download-NDK-r21e
        shell: bash
        run: |
          set -x
          NDK_DIR="$ANDROID_HOME/ndk/21.4.7075529"
          if [ ! -d "$NDK_DIR" ]; then
            cd /tmp
            wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
            unzip -q android-ndk-r21e-linux-x86_64.zip
            mv android-ndk-r21e "$NDK_DIR"
            rm -f android-ndk-r21e-linux-x86_64.zip
          fi
          ls "$NDK_DIR" | head -20
          {
            echo "ANDROID_NDK=$NDK_DIR"
            echo "ANDROID_NDK_HOME=$NDK_DIR"
          } >> "$GITHUB_ENV"

      - name: C-Download-CMake-3-22-1
        shell: bash
        run: |
          set -x
          CMAKE_DIR="$ANDROID_HOME/cmake/3.22.1"
          if [ ! -d "$CMAKE_DIR" ]; then
            cd /tmp
            wget -q https://dl.google.com/android/repository/cmake-3.22.1-linux.zip
            rm -rf /tmp/cmake_extract
            unzip -q cmake-3.22.1-linux.zip -d /tmp/cmake_extract
            mkdir -p "$CMAKE_DIR"
            mv /tmp/cmake_extract/* "$CMAKE_DIR/"
            rm -rf /tmp/cmake_extract cmake-3.22.1-linux.zip
          fi
          "$CMAKE_DIR/bin/cmake" --version

      - name: D-Install-platform-and-buildtools
        shell: bash
        run: |
          set -x
          SM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "SM=$SM"
          if [ -z "$SM" ]; then echo "sdkmanager not found"; exit 1; fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: E-local-properties
        shell: bash
        run: |
          set -x
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529"
          } > local.properties
          cat local.properties

      - name: F-Restore-keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.OWPENGRAM_KEYSTORE_B64 }}
        run: |
          set -x
          mkdir -p /root/owpengram-keystore
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > /root/owpengram-keystore/owpengram.jks
          else
            keytool -genkeypair -v \
              -keystore /root/owpengram-keystore/owpengram.jks \
              -alias owpengram -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass owpengram123 -keypass owpengram123 \
              -dname "CN=owpengram,OU=Dev,O=owpengram,L=NA,S=NA,C=IR"
          fi
          ls -la /root/owpengram-keystore/

      - name: G-chmod-gradlew
        shell: bash
        run: |
          set -x
          chmod +x gradlew
          ./gradlew --version

      - name: H-Configure-dry-run
        shell: bash
        run: |
          set -x
          set -o pipefail
          ./gradlew --no-daemon --stacktrace -m :TMessagesProj_AppStandalone:assembleRelease 2>&1 | tee configure.log

      - name: I-Build-APK
        shell: bash
        run: |
          set -x
          set -o pipefail
          ./gradlew --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=/root/owpengram-keystore/owpengram.jks \
            -Pandroid.injected.signing.store.password=owpengram123 \
            -Pandroid.injected.signing.key.alias=owpengram \
            -Pandroid.injected.signing.key.password=owpengram123 \
            :TMessagesProj_AppStandalone:assembleRelease 2>&1 | tee build.log

      - name: J-Verify-collect
        if: always()
        shell: bash
        run: |
          set -x
          find . -name '*.apk' -type f | tee apks.txt
          APK=$(head -1 apks.txt || true)
          if [ -n "${APK:-}" ]; then
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" 2>&1 | tee apk_verify.txt || true
            ls -la "$APK"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" 2>&1 | grep -E 'package:|native-code' | tee -a apk_verify.txt || true
          fi

      - name: Upload-APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-signed
          path: '**/*.apk'
          if-no-files-found: warn

      - name: Upload-logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-full
          path: |
            build.log
            configure.log
            apk_verify.txt
            apks.txt
            local.properties
          if-no-files-found: warn
